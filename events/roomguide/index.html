<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企画|学祭ポータル</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/roomguide.css"
</head>
<body>
    <header id="header-container"></header>

    <div class="roomguide-container">
        <div class="roomguide-upside-col">
            <div class="title">
                <img class="campus-icon" src="/img/nav/roomguide.svg">
                <h1>教室案内</h1>
            </div>
            <button class="main-btn" id="tutorial-btn-event-introduction">
                このページの使い方
            </button>
        </div>
        <div class="roomguide-middle-col">
                <h2>出発地</h2>
                <button class="roomguide-btn" disabled>
                    キャンパス入口（正門）
                </button>
                <h2>到着地</h2>
                <button class="roomguide-btn" popovertarget="menu">
                    キャンパスを選択
                </button>
                <div id="canpus_select" popover>
                    <select>
                        <option>あいう</option>
                        <option>宇宙</option>
                        <option>iTL</option>
                        <option>北海道</option>
                    </select>
                </div>


                
            </div>
        </div>
        <div class="roomguide-downside-col">

        </div>
    </div>

    <footer></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="/js/main.js"></script>
</body>
</html>
