<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企画例｜学祭ポータル</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/events.css">
</head>
<body>
    <button onclick="location.href='../../events/'" class="back-button">←戻る</button>
    <button class="share-button">共有</button>
    <img class="image-relative" src="../../img/events/events_hero_example.jpg" alt="画像">
    <div class="event">
        <h1>イベント</h1>
        <p>日付</p>
    </div>
    <section class="button-list">
        <button>ボタン1</button>
        <button>ボタン2</button>
        <button>ボタン3</button>
        <hr>
    </section>
    <div class="date">
        <h2>開催日時</h2>
        　 <p>2026年xx月xx日(曜)xx:xx~xx:xx</p>
        <hr>
    </div>
    <div class="place">
        <h2>場所</h2>
        <button class="map-button">MAP</button>
        <p>中央大学</p>
        <p>xxキャンパス</p>
        <p>xF</p>
        <p>xx教室</p>
    </div>
    <hr>
    <h3>このイベントについて</h3>
    <p>イベント内容の詳しい説明</p>
</body>
</html>
