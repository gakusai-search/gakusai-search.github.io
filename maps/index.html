<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>キャンパスマップ｜学祭ポータル</title>  
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/maps.css">
</head>
<body>
   <div>
      <div class="logo">
        <p>サイトロゴ</p>
      </div>
      
      <img src="Vector.svg">
   </div>
   
   <img src="location.svg">

   <h1>キャンパスマップ</h1> 
   
   <div class="info">
    <button>このページの使い方</button>
   </div>
   
   <hr>
   
   <h2>ご来場の際のご案内</h2>
   
   <button class="access info1">
    <img src="wheelchair.svg">
    
    <div class="text1">  
      <span>車いすスペース・優先席のご案内</span>
      <span>バリアフリー設備・優先席のご案内をご確認いただけます</span>
    </div>

    <img src="arrow.svg">
   </button>
   
   <hr>
   
   <button class="access info2">
    <img src="red icon.svg">
    
    <div class="text2">
        <span>Ichigaya Town Lens by C3</span>
        <span>市ヶ谷周辺の隠れた名所を巡るデジタルマップ、中大のサークル「C3」(本サイト開発元)が制作</span>
    </div>
    
    <img src="arrow.svg">
    
    <img src="map.svg" alt="map">
   </button>
</body>
</html>
