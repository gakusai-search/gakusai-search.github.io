<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャンパスマップ｜学祭ポータル</title>  
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/maps.css">
</head>
<body>
    <header id="header-container"></header>
    <nav class="navbar"></nav>

    <div class="page-header">
        <div class="page-title">
            <img src="/img/maps/maps.svg" alt="地図アイコン" class="page-icon" />
            <h1>キャンパスマップ</h1>
        </div>
        <button class="main-btn tutorial-btn" id="tutorial-btn-event-introduction">
            このページの使い方
        </button>
    </div>

    <hr>

    <h2 class="section-title">ご来場の際のご案内</h2>

    <a class="access-info" href="#" target="_blank">
        <div class="grid-container">
            <div class="grid-item">
                <img src="/img/maps/wheelchair.svg" class="access-info-icon">
            </div>

            <div class="grid-item">
                <p class="grid-item-title">車いすスペース・優先席のご案内</p>
                <p class="grid-item-description">バリアフリー設備・優先席のご案内をご確認いただけます</p>
            </div>

            <div class="grid-item">
                <img src="/img/maps/arrow.svg" class="arrow">
            </div>
        </div>
    </a>
    
    <hr>
    

    <a class="access-info" href="#" target="_blank">
        <div class="grid-container">
            <div class="grid-item">
                <img src="/img/maps/red-icon.svg" class="access-info-icon">
            </div>

            <div class="grid-item">
                <p class="grid-item-title">Ichigaya Town Lens by C3</p>
                <p class="grid-item-description">市ヶ谷周辺の隠れた名所を巡るデジタルマップ、中大のサークル「C3」(本サイト開発元)が制作</p>
            </div>

            <div class="grid-item">
                <img src="/img/maps/arrow.svg" class="arrow">
            </div>
        </div>

        <img src="/img/maps/townlens.svg" alt="Ichigaya Town Lens" class="maps-image">
    </a>

    <footer></footer>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="../js/main.js"></script>

</body>
</html>
