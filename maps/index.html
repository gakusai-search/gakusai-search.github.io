<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャンパスマップ｜学祭ポータル</title>  
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/maps.css">
</head>
<body>   
   <header id="header-container"></header>
    <nav class="navbar"></nav>

    <div class="page-header">
        <div class="page-title">
            <img src="/img/maps/maps.svg" alt="地図アイコン" class="page-icon" />
            <h1>キャンパスマップ</h1>
        </div>
        <button class="main-btn tutorial-btn" id="tutorial-btn-event-introduction">
            このページの使い方
        </button>
    </div>

   <hr>
   
   <div class="second-title">
      <p>ご来場の際のご案内</p>
   </div>

   <button class="access-info1">
    <img src="/img/maps/disabled.svg">
    
    <div class="text1">  
      <span>車いすスペース・優先席のご案内</span>
      <span>バリアフリー設備・優先席のご案内をご確認いただけます</span>
    </div>

    <img src="/img/maps/arrow.svg">
   </button>
   
   <hr>
   
   <button class="access-info2">
    <img src="/img/maps/red-icon.svg">
    
    <div class="text2">
        <span>Ichigaya Town Lens by C3</span>
        <span>市ヶ谷周辺の隠れた名所を巡るデジタルマップ、中大のサークル「C3」(本サイト開発元)が制作</span>
    </div>
    
    <img src="/img/maps/arrow.svg">
    
    <img src="/img/maps/townlens.svg" alt="Ichigaya Town Lens">
   </button>

   <footer></footer>
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="../js/main.js"></script>

</body>
</html>
