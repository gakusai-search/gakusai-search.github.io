<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>その他｜学祭ポータル</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/misc.css">
</head>

<body>
    <header id="header-container"></header>
    <nav class="navbar"></nav>

    <div class="page-header">
        <div class="page-title">
            <img src="/img/nav/misc.svg" alt="その他アイコン" class="page-icon" />
            <h1>その他</h1>
        </div>
        <button class="main-btn tutorial-btn" id="tutorial-btn-event-introduction">
            このページの使い方
        </button>
    </div>

    <hr />

    <h2 class="section-title">サイト外観の設定</h2>
    <div class="setting-card">
        <label class="radio-option">
            <input type="radio" name="theme" value="system" checked />
            <span class="custom-radio"></span>
            <span class="radio-text">端末での設定にあわせる</span>
        </label>
        <label class="radio-option">
            <input type="radio" name="theme" value="light" />
            <span class="custom-radio"></span>
            <span class="radio-text">ライトモード</span>
        </label>
        <label class="radio-option">
            <input type="radio" name="theme" value="dark" />
            <span class="custom-radio"></span>
            <span class="radio-text">ダークモード</span>
        </label>
    </div>

    <hr />

    <h2 class="section-title">協力大学 学祭公式サイト</h2>
    <div class="partner-list"></div>

    <hr />
    <h2 class="section-title">お問い合わせ</h2>
    <p>準備中</p>

    <footer></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="../js/main.js"></script>

    <script>
        const partnerUniversities = [
            {
                name: "中央大学 市ヶ谷田町キャンパス",
                festivalName: "iTLFest.2026",
                links: [
                    {
                        type: "web",
                        label: "学祭公式サイト",
                        text: "itlfest.com",
                        url: "https://itlfest.com/",
                    },
                    {
                        type: "instagram",
                        label: "Instagram",
                        text: "@festival_itl",
                        url: "https://www.instagram.com/festival_itl",
                    },
                    {
                        type: "x",
                        label: "X (Twitter)",
                        text: "@Festival_iTL",
                        url: "https://x.com/Festival_iTL",
                    },
                    {
                        type: "line",
                        label: "LINE",
                        text: "@513fripZ",
                        url: "https://line.me/R/ti/p/@513fripZ",
                    },
                    {
                        type: "threads",
                        label: "Threads",
                        text: "@festival_itl",
                        url: "https://www.threads.com/@festival_itl",
                    },
                ],
            },
        ];

        function escapeHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderPartnerUniversities() {
            const partnerList = document.querySelector(".partner-list");
            if (!partnerList) return;

            partnerList.innerHTML = partnerUniversities
                .map((partner) => {
                    const linksHtml = partner.links && partner.links.length > 0
                        ? `<div class="partner-links">
                            ${partner.links
                            .map(
                                (link) => `
                                <div class="partner-link-row">
                                    <div class="link-label-group">
                                        <img src="/img/icons/social-icon_${escapeHtml(link.type)}.svg" alt="${escapeHtml(link.label)}" class="link-icon" />
                                        <span class="link-label-text">${escapeHtml(link.label)}</span>
                                    </div>
                                    <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="link-url-text">
                                        ${escapeHtml(link.text)}
                                    </a>
                                </div>
                            `
                            )
                            .join("")}
                        </div>`
                        : "";

                    return `
                        <div class="partner-card">
                            <div class="partner-header">
                                <div class="partner-icon"></div>
                                <div class="partner-title-group">
                                    <div class="partner-name">${escapeHtml(partner.name)}</div>
                                    <div class="partner-fest">${escapeHtml(partner.festivalName)}</div>
                                </div>
                            </div>
                            ${linksHtml}
                        </div>
                    `;
                })
                .join("");
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderPartnerUniversities();

            const savedTheme = localStorage.getItem("theme") || "system";
            const radioInputs = document.querySelectorAll('input[name="theme"]');

            radioInputs.forEach((radio) => {
                if (radio.value === savedTheme) {
                    radio.checked = true;
                }

                radio.addEventListener("change", (e) => {
                    const selectedTheme = e.target.value;
                    localStorage.setItem("theme", selectedTheme);

                    if (selectedTheme === "light" || selectedTheme === "dark") {
                        document.documentElement.setAttribute("data-theme", selectedTheme);
                    } else {
                        document.documentElement.removeAttribute("data-theme");
                    }
                });
            });
        });
    </script>
</body>

</html>
