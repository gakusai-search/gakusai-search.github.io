<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室案内|学祭ポータル</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/roomguide.css">
</head>
<body>
    <header id="header-container"></header>
    <nav class="navbar"></nav>

    <div class="roomgjuide-main">
        <div class="page-header">
            <div class="page-title">
                <img src="/img/nav/roomguide.svg" alt="教室案内アイコン" class="page-icon">
                <h1>教室案内</h1>
            </div>
            <button class="main-btn tutorial-btn" id="tutorial-btn-event-introduction">
                このページの使い方
            </button>
            <hr>
        </div>
        <div class="roomguide-middle-col">
            <h2 class="section-title">場所を検索</h2>
                <select class="roomguide-btn" id="univ_select">
                    <option value="none">大学を選択</option>
                    <option value="chudai">中央大学</option>
                </select>
                <select class="roomguide-btn" id="campus_select">
                    <option value="none">キャンパスを選択</option>
                    <option value="chudai">市ヶ谷田町キャンパス</option>
                </select>
                <select class="roomguide-btn" id="buildings_select">
                    <option value="none">建物を選択</option>
                    <option value="chudai">ミドルブリッジ</option>
                </select>
                <select class="roomguide-btn" id="fl_select">
                    <option value="none">階数を選択</option>
                    <option value="itl-1">1階</option>
                    <option value="itl-3">3階</option>
                    <option value="itl-4">4階</option>
                    <option value="itl-5">5階</option>
                    <option value="itl-6">6階</option>
                    <option value="itl-7">7階</option>
                    <option value="itl-8">8階</option>
                    <option value="itl-9">9階</option>
                    <option value="itl-10">10階</option>
                    <option value="none">2階、および11階は立入できません</option>
                </select>
            <button class="roomguide-search-btn">
                フロアマップを見る
            </button>
        </div>
        <div class="roomguide-downside-col">

        </div>
    </div>

    <footer></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../roomguide/js/script.js"></script>
    <script type="text/javascript" src="../js/main.js"></script>
</body>
</html>
