<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企画|学祭ポータル</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/roomguide.css">
</head>
<body>
    <header id="header-container"></header>
    <nav class="navbar"></nav>

    <div class="roomguide-container">
        <div class="roomguide-upside-col">
            <div class="title">
                <h1>教室案内</h1>
            </div>
            <button class="main-btn" id="tutorial-btn-event-introduction">
                このページの使い方
            </button>
            <hr>
        </div>
        <div class="roomguide-middle-col">
            <h2>出発地</h2>
            <button class="roomguide-osenai-btn" disabled>
                キャンパス入口（正門）
            </button>
            <h2>到着地</h2>
                <select class="roomguide-btn" id="univ_select">
                    <option value="none">大学を選択</option>
                    <option value="chudai">中央大学</option>
                </select>
            <br>
                <select class="roomguide-btn" id="campus_select">
                    <option value="none">キャンパスを選択</option>
                    <option value="chudai">市ヶ谷田町キャンパス</option>
                </select>
            <br>
                <select class="roomguide-btn" id="buildings_select">
                    <option value="none">建物を選択</option>
                    <option value="chudai">ミドルブリッジ</option>
                </select>
            <br>
                <select class="roomguide-btn" id="fl_select">
                    <option value="none">階数を選択</option>
                    <option value="chudai">1階</option>
                    <option value="chudai">3階</option>
                    <option value="chudai">4階</option>
                    <option value="chudai">5階</option>
                    <option value="chudai">6階</option>
                    <option value="chudai">7階</option>
                    <option value="chudai">8階</option>
                    <option value="chudai">9階</option>
                    <option value="chudai">10階</option>
                    <option value="none">2階、および11階は立入できません</option>
                </select>
            <br>
                <select class="roomguide-btn" id="classrooms_select">
                    <option value="none">教室を選択</option>
                </select>
            <br>
            <button class="roomguide-search-btn">
                案内を見る
            </button>
        </div>
        <div class="roomguide-downside-col">

        </div>
    </div>

    <footer></footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../roomguide/js/script.js"></script>
    <script type="text/javascript" src="../js/main.js"></script>
</body>
</html>
